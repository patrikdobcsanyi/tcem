<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lokaler Inhaltseditor fuer die TC Eschen-Mauren Website." />
  <title>Admin Vorschau | TC Eschen-Mauren</title>
  <link rel="stylesheet" href="styles.css?v=20260816-45" />
  <link rel="stylesheet" href="admin.css?v=20260721-1" />
  <link rel="icon" type="image/png" href="assets/logos/alternate_logo.png" />
</head>
<body class="admin-page is-admin-locked">
  <header class="admin-header">
    <a class="admin-brand" href="index.html" aria-label="Zur Website">
      <img src="assets/logos/alternate_logo.png" alt="TC Eschen-Mauren" />
      <span>
        <strong>TCEM Admin</strong>
        <small>Geschuetzter Inhaltseditor</small>
      </span>
    </a>
    <a class="button secondary" href="index.html">Website ansehen</a>
  </header>

  <main class="admin-shell">
    <section class="admin-intro">
      <div>
        <p class="eyebrow">Content Cockpit</p>
        <h1>Inhalte bearbeiten</h1>
      </div>
      <div class="admin-status-grid" aria-label="Status">
        <article>
          <span>News</span>
          <strong data-admin-news-count>0</strong>
        </article>
        <article>
          <span>Termine</span>
          <strong data-admin-event-count>0</strong>
        </article>
        <article>
          <span>Naechster Termin</span>
          <strong data-admin-next-event>-</strong>
        </article>
      </div>
      <p class="admin-save-status" data-admin-save-status aria-live="polite"></p>
    </section>

    <section class="admin-workspace">
      <aside class="admin-tabs" aria-label="Admin Bereiche" data-admin-tabs></aside>
      <div data-admin-panels></div>
    </section>
  </main>

  <script src="js/news-data.js?v=20260712-1" defer></script>
  <script src="js/events-data.js?v=20260712-1" defer></script>
  <script src="js/sponsors-data.js?v=20260712-1" defer></script>
  <script src="js/membership-data.js?v=20260712-1" defer></script>
  <script src="js/matches-data.js?v=20260712-1" defer></script>
  <script src="js/vorstand-data.js?v=20260712-1" defer></script>
  <script src="js/admin.js?v=20260905-1" defer></script>
</body>
</html>
